plugins { id 'com.android.application' }

android {
    namespace 'com.siedlar.deadmansgold'
    compileSdk 35

    defaultConfig {
        applicationId 'com.siedlar.deadmansgold'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }
