name: Casino validation

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    if: github.head_ref == 'casino-ci-validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Verify source tree
        run: |
          test -f casino/api/composer.json
          test -f casino/api/artisan
          test -f casino/api/database/migrations/2026_05_12_120002_create_wallets_table.php
          test -f casino/portal/package.json
          test -f 'casino/portal/app/[locale]/(auth)/login/page.tsx'
          test -f 'casino/portal/app/[locale]/(shell)/profile/deposit/page.tsx'
          test -f 'casino/portal/app/[locale]/(shell)/profile/withdraw/page.tsx'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
      - name: Install API
        working-directory: casino/api
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Check Laravel bootstrap and routes
        working-directory: casino/api
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan route:list > /tmp/routes.txt
          grep -q 'api/v1' /tmp/routes.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: casino/portal/package-lock.json
      - name: Install portal
        working-directory: casino/portal
        run: npm ci
      - name: Typecheck portal
        working-directory: casino/portal
        run: npm run typecheck
      - name: Production build portal
        working-directory: casino/portal
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: http://127.0.0.1
          NEXT_PUBLIC_REALTIME_ENABLED: 'false'
          NEXT_PUBLIC_CRASH_REAL_MONEY: 'false'
        run: npm run build
