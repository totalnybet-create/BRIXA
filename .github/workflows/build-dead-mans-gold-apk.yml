name: Build DEAD MAN'S GOLD APK

on:
  push:
    branches: [dead-mans-gold-apk-build]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build installable APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK signature
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - name: Runtime smoke test on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            cd android-build
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.siedlar.deadmansgold
            adb shell am start -W -n com.siedlar.deadmansgold/.MainActivity | tee ../launch-result.txt
            sleep 8
            PID=$(adb shell pidof com.siedlar.deadmansgold | tr -d '\r')
            test -n "$PID"
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | tee ../activity-state.txt
            adb logcat -d > ../dead-mans-gold-logcat.txt
            if grep -qE 'FATAL EXCEPTION|Process: com\.siedlar\.deadmansgold.*has died|AndroidRuntime.*com\.siedlar\.deadmansgold' ../dead-mans-gold-logcat.txt; then
              tail -n 250 ../dead-mans-gold-logcat.txt
              exit 1
            fi
            adb exec-out screencap -p > ../dead-mans-gold-emulator.png
            cp app/build/outputs/apk/debug/app-debug.apk ../DEAD_MANS_GOLD.apk
      - name: Upload APK and runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: DEAD_MANS_GOLD_APK
          path: |
            DEAD_MANS_GOLD.apk
            dead-mans-gold-emulator.png
            dead-mans-gold-logcat.txt
            launch-result.txt
            activity-state.txt
          if-no-files-found: error
          retention-days: 30
