name: Build DEAD MAN'S GOLD APK

on:
  push:
    branches: [dead-mans-gold-apk-build]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build installable APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../DEAD_MANS_GOLD.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DEAD_MANS_GOLD_APK
          path: DEAD_MANS_GOLD.apk
          if-no-files-found: error
          retention-days: 30
