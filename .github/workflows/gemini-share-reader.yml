name: Browser Relay Reader

on:
  push:
    branches:
      - automation/gemini-reader
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-share:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Read target
        shell: bash
        run: |
          TARGET_URL="$(tr -d '\r\n' < target.txt)"
          echo "TARGET_URL=$TARGET_URL" >> "$GITHUB_ENV"
      - name: Read page in Chromium
        run: node scripts/read-gemini.mjs
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-relay-result
          path: artifacts/
          if-no-files-found: warn
