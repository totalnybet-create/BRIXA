name: Gemini Share Reader

on:
  push:
    branches:
      - automation/gemini-reader
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-share:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Read Gemini share
        env:
          TARGET_URL: https://g.co/gemini/share/d654b644704c
        run: node scripts/read-gemini.mjs
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-share-result
          path: artifacts/
          if-no-files-found: warn
