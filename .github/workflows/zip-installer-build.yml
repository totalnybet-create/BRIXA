name: Build Paczkomat ZIP APK
on:
  push:
    branches: [zip-installer-build]
    paths: ['zip-installer/**', '.github/workflows/zip-installer-build.yml']
  pull_request:
    branches: [main]
    paths: ['zip-installer/**', '.github/workflows/zip-installer-build.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zip-installer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Paczkomat-ZIP-APK
          path: zip-installer/app/build/outputs/apk/debug/app-debug.apk
