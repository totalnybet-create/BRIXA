name: Verify VoxRelay AI Android
on:
  push:
    branches: [voxrelay-build]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Android lint
        working-directory: voxrelay_native
        run: gradle lintDebug --stacktrace
      - name: Build APK
        working-directory: voxrelay_native
        run: gradle assembleDebug --stacktrace
      - name: Verify APK archive
        run: unzip -t voxrelay_native/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: VoxRelay-AI-v0.1
          path: voxrelay_native/app/build/outputs/apk/debug/app-debug.apk
