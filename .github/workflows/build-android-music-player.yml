name: Build Android Music Player APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-music-player-demo/**"
      - ".github/workflows/build-android-music-player.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-music-player-demo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BRIXA-Music-debug
          path: android-music-player-demo/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
