name: Build SongForge PL APK

on:
  workflow_dispatch:
  push:
    paths:
      - "songforge-pl/**"
      - ".github/workflows/build-songforge.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: songforge-pl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SongForge-PL-debug
          path: songforge-pl/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
